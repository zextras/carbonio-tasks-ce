type Query {
  "Returns a single task by its ID for the authenticated user."
  getTask(
  taskId: String): TaskResponse
  "Returns service metadata: name, version and flavour."
  getServiceInfo: ServiceInfo
  "Returns all non-trashed tasks for the authenticated user, optionally filtered."
  findTasks(
  status: Status
  priority: Priority): [TaskResponse]
}

type Mutation {
  "Updates an existing task. Only fields present in the input are modified."
  updateTask(
  updateTask: UpdateTaskInputInput): TaskResponse
  "Creates a new task for the authenticated user."
  createTask(
  newTask: NewTaskInputInput): TaskResponse
  "Moves a task to the TRASH status, making it invisible to normal queries."
  trashTask(
  taskId: String): String
}

type ServiceInfo {
  flavour: String
  name: String
  version: String
}

type TaskResponse {
  createdAt: BigInteger
  description: String
  id: String
  priority: Priority
  reminderAllDay: Boolean
  reminderAt: BigInteger
  status: Status
  title: String
}

input UpdateTaskInputInput {
  description: String
  id: String
  priority: Priority
  reminderAllDay: Boolean
  reminderAt: BigInteger
  status: Status
  title: String
}

input NewTaskInputInput {
  description: String
  priority: Priority
  reminderAllDay: Boolean
  reminderAt: BigInteger
  status: Status
  title: String
}

enum Status {
  COMPLETE
  OPEN
  TRASH
}

enum Priority {
  HIGH
  LOW
  MEDIUM
}
