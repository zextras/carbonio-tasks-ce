# Bootstrap extension: service name (drives config file path: /etc/carbonio/tasks/config.properties)
carbonio.service.name=carbonio-tasks

# Networking defaults (overridden at runtime by /etc/carbonio/tasks/config.properties)
networking-config.carbonio.service.host=0.0.0.0
networking-config.carbonio.service.port=10000
networking-config.carbonio.service-discover.host=127.0.0.1
networking-config.carbonio.service-discover.port=8500
networking-config.carbonio.postgresql.host=127.78.0.16
networking-config.carbonio.postgresql.port=20000
networking-config.carbonio.user-management.host=127.78.0.16
networking-config.carbonio.user-management.port=20001

# gRPC client for carbonio-user-management (token validation, health)
quarkus.grpc.clients.user-management.host=${networking-config.carbonio.user-management.host}
quarkus.grpc.clients.user-management.port=${networking-config.carbonio.user-management.port}
quarkus.grpc.clients.user-management.plain-text=true
# No gRPC server in this service — suppress startup warning
quarkus.grpc.server.start-grpc-server-for-no-services=false

# Packaging: produce a single uber-jar
quarkus.package.jar.type=uber-jar

# Native build: initialize SSPI/NTLM at run time (not build time)
quarkus.native.additional-build-args=--initialize-at-run-time=org.postgresql.sspi.SSPIClient\\,org.apache.http.impl.auth.NTLMEngineImpl

# Test profile: containers are managed by ConsulTestResource; disable Quarkus DevServices
%test.quarkus.compose.devservices.enabled=false
%test.quarkus.devservices.enabled=false
%test.networking-config.carbonio.service.host=localhost
