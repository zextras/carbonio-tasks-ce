# Bootstrap extension: service name (drives config file path: /etc/carbonio/tasks/config.properties)
carbonio.service.name=carbonio-tasks

# Networking defaults (overridden at runtime by /etc/carbonio/tasks/config.properties)
networking-config.carbonio.service.host=127.78.0.16
networking-config.carbonio.service.port=10000
networking-config.carbonio.service-discover.host=127.0.0.1
networking-config.carbonio.service-discover.port=8500
networking-config.carbonio.postgresql.host=127.78.0.16
networking-config.carbonio.postgresql.port=20000
networking-config.carbonio.user-management.host=127.78.0.16
networking-config.carbonio.user-management.port=20001

# Native build: initialize PostgreSQL SSPI at run time (not build time)
# graphql-java's i18n.Scalars/i18n.Execution resource bundles are registered for native images
# by carbonio-quarkus-extensions-graphql's own build step (NativeImageResourceBundleBuildItem,
# since 1.12.1-1) - do NOT re-add -H:IncludeResourceBundles=i18n.Scalars here.
# Caps the memory of the SmallRye GraphQL parsed-query cache (~128 MB worst case at 64 entries); native images fix it at build time.
quarkus.native.additional-build-args=--initialize-at-run-time=org.postgresql.sspi.SSPIClient,-J-Dio.smallrye.graphql.execution.queryCacheMaxSize=64

# Test profile: containers are managed by ConsulTestResource; disable Quarkus DevServices
%test.quarkus.devservices.enabled=false
%test.networking-config.carbonio.service.host=localhost

# Flyway: baseline for existing installations that predate Flyway (devel used Guice/Ebean without schema history)
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
# Note: Flyway PostgreSQL advisory lock is enabled (default). Safe for sequential upgrades.

# Config-KV migrations: scope build-time discovery to CE's own migration package.
# The extensions build step writes ONLY these FQCNs to META-INF/carbonio-migrations.list.
quarkus.carbonio-bootstrap.migrations-package=com.zextras.carbonio.tasks.config.migration

# Blocks __schema/__type queries in prod (schema-available only hides the SDL route)
%prod.quarkus.smallrye-graphql.field-visibility=no-introspection

# Like a blocking REST endpoint: the whole GraphQL request on one worker thread, resolvers inline
# (the default runs parsing and serialization on the event loop and hops to a worker per field).
quarkus.smallrye-graphql.nonblocking.enabled=false
